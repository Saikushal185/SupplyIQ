services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supplyiq}
      POSTGRES_USER: ${POSTGRES_USER:-supplyiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplyiq_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplyiq} -d ${POSTGRES_DB:-supplyiq}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    environment:
      BACKEND_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supplyiq}:${POSTGRES_PASSWORD:-supplyiq_local_password}@postgres:5432/${POSTGRES_DB:-supplyiq}
      BACKEND_REDIS_URL: redis://redis:6379/0
      BACKEND_CORS_ORIGINS: http://localhost:3000
      BACKEND_AUTO_BOOTSTRAP: ${BACKEND_AUTO_BOOTSTRAP:-true}
    volumes:
      - ./backend:/app/backend
      - ./pipeline:/app/pipeline
      - ./infra:/app/infra
      - model_artifacts:/app/backend/ml/artifacts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 600s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}/api/v1
      INTERNAL_API_BASE_URL: http://backend:8000/api/v1
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  model_artifacts:
