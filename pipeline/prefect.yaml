name: supplyiq-pipeline
prefect-version: 2.20.25
deployments:
  - name: ingestion
    entrypoint: pipeline/flows/ingestion_flow.py:run_ingestion_flow
    schedule:
      cron: 0 2 * * *
      timezone: UTC
  - name: alerts
    entrypoint: pipeline/flows/alert_flow.py:run_alert_flow
    schedule:
      cron: 0 2 * * *
      timezone: UTC
